## Egress allowlist proxy for llm-sandbox.
##
## The agent container runs on a Docker `--internal` network with no route to the
## outside world. Its only way out is CONNECT through this proxy, which refuses any
## host not listed in /etc/tinyproxy/allowlist.

User tinyproxy
Group tinyproxy

Port 8888
Timeout 600

# Reachable only from the internal Docker network; the port is never published.
Allow 0.0.0.0/0

StartServers 2
MinSpareServers 2
MaxSpareServers 8
MaxClients 100

DisableViaHeader Yes
PidFile "/tmp/tinyproxy.pid"
LogLevel Notice

# CONNECT is only permitted to 443, so the proxy cannot be used as a generic
# TCP tunnel to arbitrary ports.
ConnectPort 443

# Extended POSIX regexes matched against the destination host.
# FilterDefaultDeny makes the list an allowlist rather than a blocklist.
Filter "/etc/tinyproxy/allowlist"
FilterExtended On
FilterCaseSensitive Off
FilterURLs Off
FilterDefaultDeny Yes
