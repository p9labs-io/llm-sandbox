# Retention for ghcr.io/<owner>/llm-sandbox packages — keeps free tier tidy.
# GHCR container storage/bandwidth is currently free (GitHub Packages note); cleanup is defensive.

name: ghcr-cleanup

on:
  schedule:
    # Weekly Monday 04:17 UTC
    - cron: "17 4 * * 1"
  workflow_dispatch:
  workflow_run:
    workflows: ["Build and Push Antigravity CLI", "Build and Push Claude CLI"]
    types: [completed]

concurrency:
  group: ghcr-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    if: >
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      - name: Clean Antigravity CLI package
        uses: dataaxiom/ghcr-cleanup-action@d52806a0dc70b430571a37da1fde39733ffd640f  # v1.2.2
        with:
          package: antigravity-cli
          # Keep newest tagged digests; always preserve :latest
          keep-n-tagged: "15"
          exclude-tags: latest
          delete-untagged: "true"
          delete-orphaned-images: "true"

      - name: Clean Claude CLI package
        uses: dataaxiom/ghcr-cleanup-action@d52806a0dc70b430571a37da1fde39733ffd640f  # v1.2.2
        with:
          package: claude-cli
          # Keep newest tagged digests; always preserve :latest
          keep-n-tagged: "15"
          exclude-tags: latest
          delete-untagged: "true"
          delete-orphaned-images: "true"
