name: Build and Push Claude CLI

on:
  schedule:
    - cron: '0 6 * * 1'  # every Monday at 6am UTC
  push:
    branches: [main]
    paths:
      - images/claude/**
  pull_request:
    branches: [main]
    paths:
      - images/claude/**
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  ORG: p9labs-io

jobs:
  build:
    name: Claude Code CLI
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9  # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130  # v3.7.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3.12.0

      - name: Build and push
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25  # v5.4.0
        with:
          context: images/claude
          file: images/claude/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.ref == 'refs/heads/main' || github.event_name == 'schedule' }}
          tags: |
            ghcr.io/${{ env.ORG }}/claude-cli:latest
            ghcr.io/${{ env.ORG }}/claude-cli:${{ github.sha }}
          no-cache: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true